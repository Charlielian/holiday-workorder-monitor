# 系统基础配置
server:
  host: "0.0.0.0"
  port: 8000
  debug: true

# 数据库配置 (阉割版仅支持 SQLite 本地库)
database:
  active: "sqlite"
  sqlite:
    db_path: "data/monitor.db"
    wal_mode: true

# NQI 大数据平台接入配置
nqi:
  base_url: "https://nqi.gmcc.net:20443"
  account: "YOUR_ACCOUNT_HERE"
  password: "YOUR_PASSWORD_HERE"

# 定时调度
scheduler:
  enabled: true
  retry_interval_sec: 300

# 工单监控配置
workorder:
  enabled: true
  auto_collect: true
  collect_interval_mins: 5
  lookback_days: 7
  page_size: 100
  group_labels:
    - "集团假日保障"
  province_keys:
    - "proc_gtssxn"
    - "proc_jzfx_ssyhlc"
  finished_status_group:
    - "方案实施"
    - "效果评估中"
    - "评估通过"
    - "评估未通过"
    - "不评估"
    - "已丢弃"
    - "已办结"
    - "已归档"
    - "已完成"
